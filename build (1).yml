# ضعه في المستودع بهذا المسار: .github/workflows/build.yml
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # يبحث عن pubspec.yaml تلقائياً (حتى لو المشروع داخل مجلد فرعي)
      - name: Find Flutter project
        id: proj
        run: |
          FILE=$(find . -name pubspec.yaml -not -path '*/.*' -not -path '*/build/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$FILE" ]; then
            echo "::error::pubspec.yaml not found in the repository - upload the Flutter project files (pubspec.yaml, lib/, ...)"
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Flutter project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # إذا مجلد android غير موجود يتم إنشاؤه
      - name: Create Android files if missing
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ ! -d android ]; then
            echo "android/ folder missing - generating it"
            flutter create --platforms=android .
          fi

      - name: Get dependencies
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          flutter --version
          flutter pub get || { echo "::error::flutter pub get failed - pubspec.yaml is printed below"; cat pubspec.yaml; exit 1; }

      - name: Build APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.proj.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
